<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Exchange</title>
    <link rel="stylesheet" href="src/style.css">

    <!-- type="module" tells the browser that the script is a JavaScript module. -->
    <!-- A module is a file that can import code from other files and export its own code for other files to use. -->
    <script type="module" src="/src/main.ts"></script>

</head>

<body>
    <header class="header">
        <h1>Pocket Exchange</h1>
    </header>

    <main class="main">
        <section class="covertion">
            <div class="convertion_input">
                <div>
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" placeholder="0.00" min="0" step="any">
                </div>
                <div>
                    <label for="from">From:</label>
                    <select id="from">
                        <!-- <option value="EGP">EGP</option>
                        <option value="USD">USD</option>
                        <option value="EUR" selected>EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="SAR">SAR</option>
                        <option value="AUD">AUD</option> -->
                    </select>
                </div>
                <button id="swap">Swap</button>
                <div>
                    <label for="to">To:</label>
                    <select id="to">
                        <!-- <option value="EGP" selected>EGP</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="SAR">SAR</option>
                        <option value="AUD">AUD</option> -->
                    </select>
                </div>
            </div>
            <button id="convert">Convert</button>
            <output id="message"></output>
            <output id="result">0.00 EGP</output>
        </section>
        <hr>

        <section class="history">
            <div class="history_header">
                <span>History</span>
                <div class="history_filter">
                    <label for="filter_history">Filter:</label>
                    <select id="filter_history">
                        <option value="all" selected>All</option>
                        <optgroup label="From">
                            <option value="from_EGP">EGP</option>
                            <option value="from_USD">USD</option>
                            <option value="from_EUR">EUR</option>
                            <option value="from_GBP">GBP</option>
                        </optgroup>
                        <optgroup label="To">
                            <option value="to_EGP">EGP</option>
                            <option value="to_USD">USD</option>
                            <option value="to_EUR">EUR</option>
                            <option value="to_GBP">GBP</option>
                        </optgroup>
                    </select>
                </div>
            </div>
            <hr>
            <ul id="history_list">
                <!-- History items will be appended here -->
            </ul>
            <hr>
            <div class="history_footer">
                <span>Totals: </span>
                <output id="total_conversions">0</output>
                <button id="clear_history">Clear All</button>
            </div>
        </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
